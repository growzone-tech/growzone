# Documentation: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
# si-prefix icons: https://simpleicons.org/ (externally loaded!)
# di-prefix icons: https://dashboardicons.com/
server:
  assets-path: /app/assets
  proxied: true
branding:
  custom-footer: |
    <p>Copyright (c) 2026 <a href="https://github.com/growzone-tech/growzone">${APP_OWNER}</a></p>
    <p>Powered by <a href="https://github.com/glanceapp/glance">Glance</a></p>
  app-name: ${APP_NAME_LABEL}
  # logo-url: /assets/logo/logo.svg
  # favicon-url: /assets/logo/favicon.svg
  # app-icon-url: /assets/logo/app-icon.svg
theme:
  background-color: 50 1 6
  # primary-color: 24 97 58
  # negative-color: 209 88 54
  # primary-color: 51 33 68
  contrast-multiplier: 1.2
  primary-color: 217 92 83
  positive-color: 115 54 76
  negative-color: 347 70 65
  custom-css-file: /assets/css/main.css
pages:
  - name: Apps
    slug: apps
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: split-column
            max-columns: 3
            widgets:
              - type: monitor
                cache: 10s
                title: "Data"
                sites:
                  - title: Grafana
                    url: https://grafana.${APP_HOST}
                    check-url: http://${APP_NAME_HOST}_grafana:3000
                    icon: /assets/icons/di/grafana.svg
                  - title: "MQTTX"
                    url: https://mqttx.${APP_HOST}
                    check-url: http://${APP_NAME_HOST}_mqttx:80
                    icon: /assets/icons/di/emqx.svg
                  - title: "Traefik Dashboard"
                    url: https://traefik-dashboard.${APP_HOST}
                    check-url: http://${APP_NAME_HOST}_traefik:8080
                    icon: /assets/icons/di/traefik-proxy.svg
              - type: monitor
                cache: 10s
                title: "User Management"
                sites:
                  - title: LLDAP
                    url: https://lldap.${APP_HOST}
                    check-url: http://${APP_NAME_HOST}_lldap:17170
                    icon: /assets/icons/di/lldap-dark.svg
  #     - size: small
  #       widgets:
  #         - type: monitor
  #           define: &sp
  #             url: "#"
  #             same-tab: true
  #             icon: /assets/icons/si/docker.svg
