  - name: Development
    slug: dev
    columns:
      - size: small
        widgets:
          - type: releases
            cache: 1d # Also see: https://github.com/glanceapp/glance/blob/main/docs/configuration.md#token
            show-source-icon: true
            repositories:
              - growzone-tech/growzone
              - dockerhub:traefik:latest
              - dockerhub:tailscale/tailscale:stable
              - dockerhub:eclipse-mosquitto:latest
              - dockerhub:emqx/mqttx-web:latest
              - dockerhub:grafana/grafana:latest
              - dockerhub:authelia/authelia:latest
              - dockerhub:lldap/lldap:stable
              - dockerhub:influxdb:3-core
              - dockerhub:telegraf:latest
              - tecnativa/docker-socket-proxy
              - dockerhub:glanceapp/glance:latest

      - size: full
        widgets:
          - type: iframe
            source: 'https://grafana.otto420.growzone.tech/d-solo/hardware-metrics/hardware-metrics?orgId=1&from=now-24h&to=now&timezone=browser&var-mainDisk=&var-interval=NULL&refresh=1m&panelId=panel-8&__feature.dashboardScene=true'
            height: 200


      - size: small
        widgets:
          - type: weather
            location: Aachen, Germany
            units: metric
            hour-format: 24h
            hide-location: true