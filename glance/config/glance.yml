  - name: Development
    slug: dev
    columns:
      - size: small
        widgets:
          - type: releases
            cache: 1d # Also see: https://github.com/glanceapp/glance/blob/main/docs/configuration.md#token
            show-source-icon: true
            collapse-after: -1
            limit: 100
            repositories:
              - growzone-tech/growzone
              - dockerhub:traefik:latest
              - dockerhub:tailscale/tailscale:stable
              - dockerhub:eclipse-mosquitto:latest
              - dockerhub:emqx/mqttx-web:latest
              - dockerhub:grafana/grafana:latest
              - dockerhub:authelia/authelia:latest
              - dockerhub:lldap/lldap:stable
              - dockerhub:influxdb:3-core
              - dockerhub:telegraf:latest
              - tecnativa/docker-socket-proxy
              - dockerhub:glanceapp/glance:latest
              - dockerhub:bluenviron/mediamtx:latest
      - size: full
        widgets:
          - type: group
            title: 'Video Streams'
            widgets:
              - type: iframe
                title: 'Cam 0'
                source: 'https://mediamtx-webrtc.${APP_HOST}/cam0'
                css-class: 'aspect-ratio-16-9'
              - type: iframe
                title: 'Cam 1'
                source: 'https://mediamtx-webrtc.${APP_HOST}/cam1'
                css-class: 'aspect-ratio-16-9'
              - type: iframe
                title: 'Cam 2'
                source: 'https://mediamtx-webrtc.${APP_HOST}/cam2'
                css-class: 'aspect-ratio-16-9'
          - type: iframe
            title: 'Container Status'
            source: 'https://grafana.${APP_HOST}/d-solo/hardware-metrics/hardware-metrics?orgId=1&from=now-24h&to=now&timezone=browser&var-mainDisk=&var-interval=NULL&refresh=1m&tab=queries&showCategory=Legend&panelId=panel-5&__feature.dashboardScene=true&fullscreen'
            height: 576  # 108 + 36 * services
      - size: small
        widgets:
          - type: weather
            location: Aachen, Germany
            units: metric
            hour-format: 24h
            hide-location: true