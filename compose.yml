name: ${APP_NAME_HOST}

networks:
  internal:
    name: ${APP_NAME_HOST}_internal
    driver: bridge
    ipam:
      config:
        - subnet: "${APP_NETWORK_POOL}"

volumes:
  habitat-config:

# No Secrets, Syntax Stub:
# secrets:
#   SECRET_NAME:
#     file: ${SECRETS_DIR}/SECRET_NAME

services:

  habitat-config-growzone:
    image: tschebbischeff/habitat-config:latest
    container_name: ${APP_NAME_HOST}_habitat-config-growzone
    restart: no
    env_file:
      - ./.env
      - path: ${ENV_DIR}/.env
        required: false
      - path: ${ENV_DIR}/habitat-config.env
        required: false
    environment:
      MODULE_NAME: "growzone"
    networks:
      internal:
    volumes:
      - habitat-config:/habitat-config/orchestration
      - ./habitat-config:/habitat-config/source:ro

  hardware-controller:
    build:
      context: ./hardware-controller
    container_name: ${APP_NAME_HOST}_hardware-controller
    restart: unless-stopped
    env_file:
      - ./.env
      - path: ${ENV_DIR}/.env
        required: false
      - path: ${ENV_DIR}/hardware-controller.env
        required: false
    environment:
      MQTT_HOST: "${APP_NAME_HOST}_mosquitto"
    volumes:
      - "/sys/firmware/devicetree/base:/sys/firmware/devicetree/base:ro"
      - "/proc/cpuinfo:/proc/cpuinfo:ro"
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/gpiochip1:/dev/gpiochip1"
    security_opt:
      - "systempaths=unconfined"
    networks:
      internal:
    healthcheck:
      test: [ "CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
